<h3 style="text-align: center;">欢迎使用津医保</h3>
<div>亲爱的用户，感谢您一直以来的支持！</div>
<div><br></div>
<div>
  为了更好的保护您的权益，同时遵守相关监管要求，我们更新了<a href="https://jyt.ylbz.tj.gov.cn:4443/privacy/privacy.html" target="_blank">《隐私政策》</a>，<a href="https://jyt.ylbz.tj.gov.cn:4443/privacy/privacy_child.html" target="_blank">《儿童个人信息处理规则及用户协议》</a>特向您说明如下：
</div>
<div><br></div>
<div>
  1.为向您提供基本服务，我们会遵循正当、合法、必要的原则收集和使用必要的信息；
</div>
<div>
  2.基于您的授权，我们后续可能会收集和使用您的设备和位置（以便为您提供更好的服务）等信息，您有权拒绝或取消；
</div>
<div>
  3.未经您的授权同意，我们不会将您的信息共享给第三方或用于您未授权的其他用途；&nbsp;
</div>
