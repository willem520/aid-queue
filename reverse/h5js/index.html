        <script>
            document.addEventListener('DOMContentLoaded', function() {
                document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px'
            })
			
			if (navigator.userAgent.indexOf('AlipayClient') > -1) {
			    document.writeln('<script src="https://appx/web-view.min.js"' + '>' + '<' + '/' + 'script>');
			}
			
			// if (/miniProgram/i.test(navigator.userAgent) && /micromessenger/i.test(navigator.userAgent)) {
			    // document.writeln('<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"' + '>' + '<' + '/' + 'script>');
				// console.log("wx", wx);
				// wx.miniProgram.navigateTo({url: "/pages/404/404"});
			// }
			// 新增dataSouc == 11的判断
			window.observer = false;
			window.mdLoadfinish = false;
			onViewOpen=function(){
				var dataSouc = md.getPrefs( {
					key: 'dataSouc'
				} ) || '';
				if( dataSouc == 2 || dataSouc == 11 ) {
					document.body.style.zoom = 2;
				}else if( dataSouc == 1 ){
					document.body.style.zoom = 1;
				}
				var url = window.location.href;
				var reg = "+";
				if( url.indexOf( reg ) >= 0 ) {
					url = url.replace( /\+/g, "%2B" );
					window.location.href = url;
					var systemType = md.systemType;
					if( systemType == "android" || systemType == "harmony") {
						return;
					}
				}
				observer = true;
			}
			function enlargeAPhoto( e ) {
				var url = e.getAttribute("src");
				photoBrowser.open({
				    images: [ 
						url
				    ],
				    bgColor: '#000000'
				}, (ret) => {
				    if(ret.eventType == 'click'){
						photoBrowser.close();//在点击图片的时候来关闭图片浏览器
				    }
				});
			}
        </script>
